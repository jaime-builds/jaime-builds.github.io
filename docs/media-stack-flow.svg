<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" font-family="'JetBrains Mono', ui-monospace, monospace">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a5548"/>
    </marker>
    <marker id="arrowGold2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c9a85d"/>
    </marker>
  </defs>

  <rect width="1100" height="560" fill="#08080c"/>

  <text x="40" y="46" fill="#c9a85d" font-size="12" letter-spacing="2">— MEDIA STACK FLOW</text>

  <!-- Lane labels -->
  <text x="40" y="118" fill="#8a857a" font-size="10" letter-spacing="1">VIDEO</text>
  <text x="40" y="228" fill="#8a857a" font-size="10" letter-spacing="1">BOOKS</text>

  <!-- Video lane -->
  <rect x="30" y="90" width="180" height="52" rx="6" fill="#141210" stroke="#3a352c" stroke-width="1.5"/>
  <text x="120" y="121" text-anchor="middle" fill="#e8e4db" font-size="12">Private Tracker</text>

  <rect x="30" y="200" width="180" height="52" rx="6" fill="#141210" stroke="#3a352c" stroke-width="1.5"/>
  <text x="120" y="231" text-anchor="middle" fill="#e8e4db" font-size="12">Book Search UI</text>
  <text x="120" y="246" text-anchor="middle" fill="#8a857a" font-size="9">self-built</text>

  <!-- Seedbox (shared) -->
  <rect x="270" y="150" width="200" height="62" rx="6" fill="#141210" stroke="#3a352c" stroke-width="1.5"/>
  <text x="370" y="176" text-anchor="middle" fill="#e8e4db" font-size="13">Seedbox</text>
  <text x="370" y="194" text-anchor="middle" fill="#8a857a" font-size="10">downloads · seeds for ratio</text>

  <path d="M210,116 C240,116 240,175 270,175" fill="none" stroke="#5a5548" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <path d="M210,226 C240,226 240,187 270,187" fill="none" stroke="#5a5548" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- Scheduled sync -->
  <rect x="540" y="150" width="200" height="62" rx="6" fill="#141210" stroke="#3a352c" stroke-width="1.5"/>
  <text x="640" y="176" text-anchor="middle" fill="#e8e4db" font-size="13">Scheduled Sync</text>
  <text x="640" y="194" text-anchor="middle" fill="#8a857a" font-size="10">rclone, timed jobs</text>
  <path d="M470,181 L540,181" fill="none" stroke="#5a5548" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- Storage array (highlighted) -->
  <rect x="810" y="145" width="220" height="72" rx="6" fill="#1c1712" stroke="#c9a85d" stroke-width="1.5"/>
  <text x="920" y="176" text-anchor="middle" fill="#f2ead9" font-size="13" font-weight="600">Storage Array</text>
  <text x="920" y="194" text-anchor="middle" fill="#c9a85d" font-size="10">Unraid · parity-protected</text>
  <path d="M740,181 L810,181" fill="none" stroke="#5a5548" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- Consumption fan-out -->
  <rect x="810" y="290" width="220" height="60" rx="6" fill="#141210" stroke="#3a352c" stroke-width="1.5"/>
  <text x="920" y="316" text-anchor="middle" fill="#e8e4db" font-size="12">Plex / Jellyfin</text>
  <text x="920" y="334" text-anchor="middle" fill="#8a857a" font-size="9">media server apps</text>

  <rect x="810" y="370" width="220" height="60" rx="6" fill="#141210" stroke="#3a352c" stroke-width="1.5"/>
  <text x="920" y="396" text-anchor="middle" fill="#e8e4db" font-size="12">Virtual Live TV</text>
  <text x="920" y="414" text-anchor="middle" fill="#8a857a" font-size="9">self-built, AI-scheduled</text>

  <rect x="810" y="450" width="220" height="60" rx="6" fill="#141210" stroke="#3a352c" stroke-width="1.5"/>
  <text x="920" y="476" text-anchor="middle" fill="#e8e4db" font-size="12">Ebook / Audiobook Library</text>
  <text x="920" y="494" text-anchor="middle" fill="#8a857a" font-size="9">auto-import on arrival</text>

  <path d="M920,217 C920,250 920,270 920,290" fill="none" stroke="#c9a85d" stroke-width="1.5" marker-end="url(#arrowGold2)"/>
  <path d="M920,217 C990,240 990,370 920,370" fill="none" stroke="#c9a85d" stroke-width="1.5" marker-end="url(#arrowGold2)"/>
  <path d="M920,217 C1050,260 1050,450 920,450" fill="none" stroke="#c9a85d" stroke-width="1.5" marker-end="url(#arrowGold2)"/>

  <text x="40" y="530" fill="#5a5548" font-size="10">acquisition happens off-site on the seedbox · nothing torrents directly on the home network</text>
</svg>
