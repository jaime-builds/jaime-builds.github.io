<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" font-family="'JetBrains Mono', ui-monospace, monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a5548"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c9a85d"/>
    </marker>
  </defs>

  <rect width="1100" height="680" fill="#08080c"/>

  <!-- title -->
  <text x="40" y="46" fill="#c9a85d" font-size="12" letter-spacing="2">— NETWORK TOPOLOGY</text>

  <!-- Internet cloud -->
  <g>
    <ellipse cx="550" cy="90" rx="90" ry="34" fill="#141210" stroke="#3a352c" stroke-width="1.5"/>
    <text x="550" y="95" text-anchor="middle" fill="#e8e4db" font-size="14">Internet</text>
  </g>

  <!-- ISP -->
  <g>
    <rect x="470" y="150" width="160" height="46" rx="6" fill="#141210" stroke="#3a352c" stroke-width="1.5"/>
    <text x="550" y="178" text-anchor="middle" fill="#c8c4bc" font-size="12">ISP — Fiber WAN</text>
  </g>
  <line x1="550" y1="124" x2="550" y2="150" stroke="#5a5548" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Router -->
  <g>
    <rect x="450" y="230" width="200" height="52" rx="6" fill="#141210" stroke="#3a352c" stroke-width="1.5"/>
    <text x="550" y="254" text-anchor="middle" fill="#e8e4db" font-size="13">Router</text>
    <text x="550" y="272" text-anchor="middle" fill="#8a857a" font-size="10">Wi-Fi 7 · 192.168.1.1</text>
  </g>
  <line x1="550" y1="196" x2="550" y2="230" stroke="#5a5548" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Switch -->
  <g>
    <rect x="450" y="330" width="200" height="46" rx="6" fill="#141210" stroke="#3a352c" stroke-width="1.5"/>
    <text x="550" y="358" text-anchor="middle" fill="#c8c4bc" font-size="12">Multi-gig Switch</text>
  </g>
  <line x1="550" y1="282" x2="550" y2="330" stroke="#5a5548" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Gaming PC (direct to router) -->
  <g>
    <rect x="740" y="330" width="190" height="52" rx="6" fill="#141210" stroke="#3a352c" stroke-width="1.5"/>
    <text x="835" y="354" text-anchor="middle" fill="#e8e4db" font-size="13">Gaming PC</text>
    <text x="835" y="372" text-anchor="middle" fill="#8a857a" font-size="10">2.5G direct · 192.168.1.10</text>
  </g>
  <path d="M650,250 C700,250 700,356 740,356" fill="none" stroke="#5a5548" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Media Server (highlighted) -->
  <g>
    <rect x="450" y="430" width="200" height="60" rx="6" fill="#1c1712" stroke="#c9a85d" stroke-width="1.5"/>
    <text x="550" y="456" text-anchor="middle" fill="#f2ead9" font-size="13" font-weight="600">Media Server</text>
    <text x="550" y="475" text-anchor="middle" fill="#c9a85d" font-size="10">Unraid · 192.168.1.12</text>
  </g>
  <line x1="550" y1="376" x2="550" y2="430" stroke="#5a5548" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Drive Enclosure -->
  <g>
    <rect x="240" y="430" width="180" height="60" rx="6" fill="#141210" stroke="#3a352c" stroke-width="1.5"/>
    <text x="330" y="456" text-anchor="middle" fill="#e8e4db" font-size="12">Drive Enclosure</text>
    <text x="330" y="474" text-anchor="middle" fill="#8a857a" font-size="10">USB, multi-bay</text>
  </g>
  <line x1="450" y1="460" x2="420" y2="460" stroke="#5a5548" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>

  <!-- Wi-Fi Main -->
  <g>
    <rect x="30" y="230" width="190" height="52" rx="6" stroke-dasharray="4 3" fill="#141210" stroke="#3a352c" stroke-width="1.5"/>
    <text x="125" y="254" text-anchor="middle" fill="#c8c4bc" font-size="12">Wi-Fi — Main</text>
    <text x="125" y="271" text-anchor="middle" fill="#8a857a" font-size="10">trusted devices</text>
  </g>
  <path d="M450,256 C300,256 300,256 220,256" fill="none" stroke="#5a5548" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Wi-Fi IoT -->
  <g>
    <rect x="30" y="330" width="190" height="52" rx="6" stroke-dasharray="4 3" fill="#141210" stroke="#3a352c" stroke-width="1.5"/>
    <text x="125" y="354" text-anchor="middle" fill="#c8c4bc" font-size="12">Wi-Fi — IoT</text>
    <text x="125" y="371" text-anchor="middle" fill="#8a857a" font-size="10">isolated from Main</text>
  </g>
  <path d="M450,310 C300,310 300,356 220,356" fill="none" stroke="#5a5548" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Cloudflare Tunnel -->
  <g>
    <rect x="770" y="430" width="230" height="60" rx="6" fill="#1c1712" stroke="#c9a85d" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="885" y="456" text-anchor="middle" fill="#f2ead9" font-size="12">Cloudflare Tunnel</text>
    <text x="885" y="474" text-anchor="middle" fill="#c9a85d" font-size="10">outbound only · no open ports</text>
  </g>
  <path d="M650,460 C710,460 710,460 770,460" fill="none" stroke="#c9a85d" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrowGold)"/>
  <path d="M885,430 C885,300 700,140 640,105" fill="none" stroke="#c9a85d" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrowGold)"/>

  <!-- Legend -->
  <g>
    <line x1="40" y1="600" x2="70" y2="600" stroke="#5a5548" stroke-width="1.5"/>
    <text x="80" y="604" fill="#8a857a" font-size="11">wired / local network</text>

    <line x1="40" y1="628" x2="70" y2="628" stroke="#c9a85d" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="80" y="632" fill="#8a857a" font-size="11">Cloudflare Tunnel — external access</text>
  </g>

  <text x="40" y="660" fill="#5a5548" font-size="10">no ports forwarded on the router · all external access via tunnel</text>
</svg>
